name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Verify production bundle (not dev index.html)
        run: |
          test -f dist/index.html
          grep -q 'src="/assets/index-' dist/index.html || (echo "dist/index.html missing hashed JS bundle" && exit 1)
          ! grep -q '/src/main.tsx' dist/index.html || (echo "dist still references dev /src/main.tsx — build misconfigured" && exit 1)

      # Pushes dist/ to branch `gh-pages`. In repo Settings → Pages, choose that branch + /(root).
      # (Publishing main’s root serves source index.html with /src/main.tsx → blank site.)
      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
